        <div>
          <p class="link-text" id="student-link"></p>
          <button id="copy-link" class="btn-ghost" style="margin-top:10px;">Copy link</button>
        </div>
      </div>
    </div>

    <div class="panel" id="round-panel"></div>

    <div class="panel" id="history-panel">
      <div class="top-row">
        <h3>Past rounds</h3>
        <button id="clear-history-btn" class="btn-ghost" style="display:none;">Clear history</button>
      </div>
      <div id="history-list" style="margin-top:10px;"></div>
    </div>
  </div>

  <div id="confirm-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3>Delete all past rounds?</h3>
      <p class="muted" style="margin-top:8px;">This permanently removes every revealed round and its bids from the history below. The round in progress, if any, is not affected. This can't be undone.</p>
      <p class="pin-error" id="delete-error"></p>
      <div class="btn-row">
        <button id="confirm-delete-btn" class="btn-rust">Delete all</button>
        <button id="cancel-delete-btn" class="btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

</div>

<script type="module">
import {
  startNewRound, closeRound, revealRound,
  subscribeLatestRound, subscribeBids, subscribeRecentRounds, clearHistory, formatCurrency,
} from "./db.js";

// Change this before you deploy — this is a soft deterrent for a classroom,
// not real security. See README.md, "Security note".
const SIR_PIN = "2468";

const pinGate = document.getElementById("pin-gate");
const dashboard = document.getElementById("dashboard");
const pinInput = document.getElementById("pin");
const pinError = document.getElementById("pin-error");

function unlock() {
  sessionStorage.setItem("coinbag_sir_ok", "1");
  pinGate.style.display = "none";
  dashboard.style.display = "block";
  boot();
}

document.getElementById("pin-submit").addEventListener("click", tryUnlock);
pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
function tryUnlock() {
  if (pinInput.value === SIR_PIN) { unlock(); }
  else { pinError.textContent = "That's not it — try again."; pinInput.value = ""; pinInput.focus(); }
}

if (sessionStorage.getItem("coinbag_sir_ok") === "1") unlock();

// ---------------- QR + link ----------------

function setupShareLink() {
  const url = new URL("student.html", window.location.href).href;
  document.getElementById("student-link").textContent = url;
  document.getElementById("copy-link").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(url);
      const btn = document.getElementById("copy-link");
      const original = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = original; }, 1400);
    } catch (err) { console.error(err); }
  });
}

// ---------------- Round panel ----------------

let round = null;
let bids = [];
let unsubBids = null;

const roundPanel = document.getElementById("round-panel");

function statusPill(status) {
  const labels = { open: "Open", closed: "Closed", revealed: "Revealed" };
  return `<span class="pill ${status}">${labels[status] || status}</span>`;
}

function renderRoundPanel() {
  if (!round || round.status === "revealed") {
    roundPanel.innerHTML = `
      <h3>${round ? "Ready for the next round" : "Start the game"}</h3>
      ${round ? renderRevealedSummary(round) : `<p class="muted" style="margin-top:8px;">Show the class the bag, then start a round.</p>`}
      <form id="start-form" style="margin-top:${round ? "20px" : "18px"};">
        <div class="field">
          <label for="round-label">Round name (optional)</label>
          <input type="text" id="round-label" placeholder="e.g. Round 3" maxlength="40">
        </div>
        <button type="submit" class="btn-brass">Start new round</button>
      </form>`;
    document.getElementById("start-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const label = document.getElementById("round-label").value;
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Starting…";
      try { await startNewRound(label); }
      catch (err) { console.error(err); btn.disabled = false; btn.textContent = "Start new round"; }
    });
    return;
  }

  const leader = bids[0];
  const rowsHtml = bids.length
    ? bids.map((b, i) => `
        <tr class="${i === 0 ? "leader" : ""}">
          <td class="rank mono">${i + 1}</td>
          <td>${escapeHtml(b.name)}</td>
          <td class="amount">${formatCurrency(b.amount)}</td>
        </tr>`).join("")
    : `<tr><td colspan="3" class="muted" style="padding:14px 10px;">No bids yet.</td></tr>`;

  roundPanel.innerHTML = `
    <div class="top-row">
      <h3>${escapeHtml(round.label || "Current round")}</h3>
      ${statusPill(round.status)}
    </div>

    <div style="margin-top:16px;">
      <div class="hero-figure">${leader ? formatCurrency(leader.amount) : "—"}</div>
      <div class="hero-label">${leader ? `highest bid — ${escapeHtml(leader.name)}` : "no bids yet"} · ${bids.length} bid${bids.length === 1 ? "" : "s"} so far</div>
    </div>

    <table class="ledger">
      <thead><tr><th></th><th>Name</th><th>Bid</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>

    ${round.status === "open" ? `
      <div class="btn-row">
        <button id="close-round" class="btn-rust">Close bidding</button>
      </div>` : ""}

    ${round.status === "closed" ? `
      <form id="reveal-form" style="margin-top:20px;">
        <div class="field">
          <label for="actual-value">What is the bag actually worth?</label>
          <input type="number" id="actual-value" min="0" step="1" placeholder="0" inputmode="numeric" required>
        </div>
        <button type="submit" class="btn-brass">Reveal to the class</button>
      </form>` : ""}
  `;

  const closeBtn = document.getElementById("close-round");
  if (closeBtn) closeBtn.addEventListener("click", async () => {
    closeBtn.disabled = true;
    closeBtn.textContent = "Closing…";
    try { await closeRound(round.id); }
    catch (err) { console.error(err); closeBtn.disabled = false; closeBtn.textContent = "Close bidding"; }
  });

  const revealForm = document.getElementById("reveal-form");
  if (revealForm) revealForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = Number(document.getElementById("actual-value").value);
    if (!Number.isFinite(value) || value < 0) return;
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    btn.textContent = "Revealing…";
    try { await revealRound(round.id, value); }
    catch (err) { console.error(err); btn.disabled = false; btn.textContent = "Reveal to the class"; }
  });
}

function renderRevealedSummary(r) {
  if (!r.winnerName) return `<p class="muted" style="margin-top:8px;">${escapeHtml(r.label || "Last round")} had no bids.</p>`;
  const diff = r.winnerBid - r.actualValue;
  const verb = diff > 0 ? `paid ${formatCurrency(diff)}` : diff < 0 ? `received ${formatCurrency(-diff)}` : `broke even`;
  return `<p class="muted" style="margin-top:8px;">${escapeHtml(r.label || "Last round")}: <strong>${escapeHtml(r.winnerName)}</strong> won with ${formatCurrency(r.winnerBid)} against a bag worth ${formatCurrency(r.actualValue)} — ${verb}.</p>`;
}

function watchBids(roundId) {
  if (unsubBids) unsubBids();
  bids = [];
  unsubBids = subscribeBids(roundId, (b) => { bids = b; renderRoundPanel(); });
}

// ---------------- History ----------------

function renderHistory(rounds) {
  const revealed = rounds.filter((r) => r.status === "revealed");
  const list = document.getElementById("history-list");
  document.getElementById("clear-history-btn").style.display = revealed.length ? "" : "none";
  if (!revealed.length) {
    list.innerHTML = `<p class="muted">Revealed rounds will show up here.</p>`;
    return;
  }
  list.innerHTML = revealed.map((r) => {
    if (!r.winnerName) {
      return `<div class="history-row"><div class="history-left">${escapeHtml(r.label || "Round")}</div><div class="history-right muted">no bids</div></div>`;
    }
    const diff = r.winnerBid - r.actualValue;
    const verb = diff > 0 ? `pays ${formatCurrency(diff)}` : diff < 0 ? `receives ${formatCurrency(-diff)}` : `even`;
    return `
      <div class="history-row">
        <div class="history-left">${escapeHtml(r.label || "Round")}<br><span class="muted">${escapeHtml(r.winnerName)} — ${formatCurrency(r.winnerBid)} bid, worth ${formatCurrency(r.actualValue)}</span></div>
        <div class="history-right mono">${verb}</div>
      </div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------------- Clear history ----------------

const confirmModal = document.getElementById("confirm-modal");
const deleteError = document.getElementById("delete-error");

document.getElementById("clear-history-btn").addEventListener("click", () => {
  deleteError.textContent = "";
  confirmModal.style.display = "flex";
});
document.getElementById("cancel-delete-btn").addEventListener("click", () => {
  confirmModal.style.display = "none";
});
confirmModal.addEventListener("click", (e) => {
  if (e.target === confirmModal) confirmModal.style.display = "none";
});
document.getElementById("confirm-delete-btn").addEventListener("click", async () => {
  const btn = document.getElementById("confirm-delete-btn");
  btn.disabled = true;
  btn.textContent = "Deleting…";
  deleteError.textContent = "";
  try {
    await clearHistory();
    confirmModal.style.display = "none";
  } catch (err) {
    console.error(err);
    deleteError.textContent = "Couldn't delete — check your connection and try again.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Delete all";
  }
});

// ---------------- Boot ----------------

let booted = false;
function boot() {
  if (booted) return;
  booted = true;
  subscribeLatestRound((r) => {
    round = r;
    if (r && (r.status === "open" || r.status === "closed")) watchBids(r.id);
    else { if (unsubBids) unsubBids(); bids = []; }
    renderRoundPanel();
  });
  subscribeRecentRounds(renderHistory);
  try { setupShareLink(); } catch (err) { console.error("Share link setup failed:", err); }
}
</script>
</body>
</html>
